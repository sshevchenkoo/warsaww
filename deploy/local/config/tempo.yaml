# Single-binary Tempo (mirrors deploy/cloud/platform/tempo-values.yaml) — receives OTLP from
# the collector and stores traces on a local volume. Grafana queries it at :3200.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
