# Full local stack — the app PLUS the same observability the cloud runs, so the
# ELK and Prometheus/Grafana DevOps modules are demonstrable on a laptop (the
# DigitalOcean env is torn down). One command: `make stack-up`.
#
# Cloud parity, with the delivery mechanism adapted to Compose:
#   - DOKS Helm charts (kube-prometheus-stack / otel / tempo / postgres-exporter
#     / fluent-bit) → plain containers with static config under deploy/local/config/.
#   - k8s CRDs (ServiceMonitor / PrometheusRule) → prometheus.yml + rules.yml.
#   - ELK mirrors deploy/cloud/ansible/roles/elk (ES + Logstash + Kibana),
#     fed by Fluent Bit shipping every container's logs (Docker fluentd driver).
# k8s-only signals (kube-state-metrics / node-exporter pod & node panels) have no
# local equivalent and simply stay empty — see deploy/local/README.md.
name: warsaw-stack

services:
  # ─── App ────────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: events
    # No host port: reached only by other containers over the docker network.
    # Use `docker compose exec db psql -U app -d events` for a shell / dumps.
    volumes:
      - ../../backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d events"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # No host port: internal only (used by api for quotas / rate limits).

  api:
    build: ../../backend
    # API keys (ANTHROPIC_API_KEY, VOYAGE_API_KEY, …) come from backend/.env.
    # Marked optional so the stack still boots without it (the API needs it to
    # actually serve — copy backend/.env.example to backend/.env).
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/events
      REDIS_URL: redis://redis:6379/0
      # Turn on OpenTelemetry tracing → otel-collector → Tempo (already wired in
      # app/observability.py; only needs this endpoint set).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: warsaw-api
      # The site is served over HTTPS by the nginx front (https://localhost); the
      # Google OAuth redirect URI is built from this. TLS-only mode, so
      # SESSION_HTTPS_ONLY stays off (cookies aren't marked Secure) and opening
      # http://localhost:3000 directly still works.
      FRONTEND_URL: https://localhost
    # No host port: the API is reached only through the nginx HTTPS front (the
    # browser talks to the app at https://localhost, which proxies to the API
    # internally). Keeps every browser↔backend hop on HTTPS, per the subject.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "warsaw.api"
    # Periodic ingestion — the local mirror of the cloud k8s CronJobs
    # (deploy/cloud/k8s/50-cronjobs.yml). The `ofelia` scheduler reads these
    # labels and `docker exec`s the runner in this container on schedule. Only
    # active when ofelia runs (opt-in: `make scheduler-up`). Same 6-field cron
    # as the cloud (leading 0 = seconds). Shorten to e.g. "@every 2m" to test.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.ingest-places.schedule: "0 0 4 * * 1"        # Mondays 04:00
      ofelia.job-exec.ingest-places.command: "python -m app.ingestion.runner --source=places"
      ofelia.job-exec.ingest-facebook.schedule: "0 0 */6 * * *"    # every 6h
      ofelia.job-exec.ingest-facebook.command: "python -m app.ingestion.runner --source=facebook_events"
      ofelia.job-exec.ingest-ticketmaster.schedule: "0 0 */12 * * *"  # every 12h
      ofelia.job-exec.ingest-ticketmaster.command: "python -m app.ingestion.runner --source=ticketmaster"

  web:
    build:
      context: ../../frontend
      args:
        # next.config rewrites are baked at BUILD time, so the API upstream must
        # be passed as a build-arg (a runtime env is too late — Next would keep
        # the image's default localhost:8000 and fail to proxy /auth, /search…).
        BACKEND_INTERNAL_URL: http://api:8000
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    # No host port: the site is served only via the nginx HTTPS front on :443
    # (https://localhost). nginx reaches this container over the docker network.
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "warsaw.web"

  # ─── Metrics: Prometheus + Alertmanager + Grafana + postgres-exporter ─────────
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    # Not published directly — reachable from the host only through the nginx
    # auth gateway (see the `nginx` service). Internal scrapes use the docker net.

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # Reachable only through the nginx auth gateway (not published directly).

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://app:app@db:5432/events?sslmode=disable"
    # Internal only (scraped by Prometheus over the docker network) — no host port.
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    # Admin credentials come from deploy/local/secrets.env (run `make infra-auth`);
    # without that file Grafana falls back to its built-in default admin/admin.
    env_file:
      - path: ./secrets.env
        required: false
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Served over HTTPS through the nginx front on :3001 — tell Grafana so its
      # redirects/absolute links use https://localhost:3001 (not http://…:3000).
      GF_SERVER_ROOT_URL: "https://localhost:3001/"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # No host port: reached via the nginx HTTPS front (https://localhost:3001).
    depends_on:
      prometheus:
        condition: service_started

  # ─── Traces: OpenTelemetry Collector → Tempo ──────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # Internal only: the API pushes spans to otel-collector:4317 and Prometheus
    # scrapes otel-collector:8889 over the docker network — no host ports needed.
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # Internal only: Grafana queries tempo:3200 over the docker network.

  # ─── Logs: Elasticsearch + Logstash + Kibana, fed by Fluent Bit ───────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.21
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Lighter heap than the cloud droplet (2g) — enough for a local demo.
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    # Internal only: Kibana/Logstash reach elasticsearch:9200 over the docker net.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.21
    volumes:
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.21
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_HOST=0.0.0.0
    # Not published directly — reached from the host via the nginx auth gateway.
    depends_on:
      elasticsearch:
        condition: service_healthy

  fluent-bit:
    image: fluent/fluent-bit:3.1.6
    volumes:
      - ./config/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    ports:
      - "24224:24224"       # forward input — the Docker fluentd log driver target
      - "24224:24224/udp"
    depends_on:
      logstash:
        condition: service_started

  # ─── Host resources: node-exporter ───────────────────────────────────────────
  # node-exporter: metrics about the whole host VM (CPU/RAM/disk/network/load).
  # Reads the host's /proc, /sys and root fs (mounted read-only) so it reports the
  # machine, not the container. On Linux only — on Docker Desktop it sees the VM.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|rootfs|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    # Internal only: scraped by Prometheus at node-exporter:9100 over the docker net.
    restart: unless-stopped

  # ─── HTTPS gateway: the only way in from the host ─────────────────────────────
  # Terminates TLS for everything browser-facing — the site on :443 (→ web) and
  # the infra UIs Grafana/Kibana/Prometheus/Alertmanager on their own HTTPS ports
  # (the infra UIs also require a login from deploy/local/.htpasswd, `make
  # infra-auth`). None of web/api/grafana publish a host port, so every
  # browser↔backend hop is HTTPS — per the subject. Mirrors the cloud's
  # ingress-nginx + cert-manager. Self-signed cert in deploy/local/certs
  # (regenerate with `make local-tls`).
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "443:443"      # → web (the site, HTTPS)
      - "80:80"        # → redirect to HTTPS
      - "3001:3001"    # → Grafana       (HTTPS, Grafana login)
      - "5601:5601"    # → Kibana        (HTTPS, login required)
      - "9090:9090"    # → Prometheus    (HTTPS, login required)
      - "9093:9093"    # → Alertmanager  (HTTPS, login required)
    depends_on:
      - web
      - grafana
      - kibana
      - prometheus
      - alertmanager

  # ─── Scheduler: periodic ingestion (mirrors the cloud k8s CronJobs) ───────────
  # Reads the ofelia.* labels on the `api` service and runs the ingestion runner
  # inside it on schedule. Opt-in via a compose profile so a plain `make stack-up`
  # doesn't quietly start hitting external APIs — enable with `make scheduler-up`.
  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    profiles: ["scheduler"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  tempo-data:
  es-data:
