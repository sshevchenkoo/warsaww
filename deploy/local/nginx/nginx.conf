# HTTPS gateway for the whole local stack. nginx terminates TLS on every
# browser-facing port and reverse-proxies to the internal service over the docker
# network. The services' own ports are NOT published to the host, so this is the
# only way in — and every way in is HTTPS (per the ft_transcendence subject:
# browser↔backend must be encrypted; internal container hops may be plain).
# Mirrors the cloud, where ingress-nginx + cert-manager terminate TLS.
events {}

http {
  # One self-signed cert shared by all HTTPS server blocks (see deploy/local/certs,
  # regenerate with `make local-tls`). The browser shows a one-time "not secure"
  # warning — click through. For a trusted cert without the warning, use mkcert.
  ssl_certificate     /etc/nginx/certs/localhost.crt;
  ssl_certificate_key /etc/nginx/certs/localhost.key;

  # ── The site (Next.js app) over HTTPS ─────────────────────────────────────
  # The app itself proxies /search, /auth/*, /me etc. to the API internally.
  server {
    listen 443 ssl;
    server_name localhost;
    location / {
      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;   # Next HMR / any ws
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;           # tell the app it's HTTPS
      proxy_read_timeout 300;
    }
  }

  # Plain HTTP → redirect to HTTPS.
  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }

  # ── Infra UIs, all over HTTPS ──────────────────────────────────────────────
  # Grafana — has its own login (admin password from secrets.env), so no extra
  # basic auth. ROOT_URL is set on the service so redirects use https://…:3001.
  server {
    listen 3001 ssl;
    location / {
      proxy_pass         http://grafana:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;   # Grafana Live (websocket)
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
    }
  }

  # Kibana — basic auth + WebSocket upgrade for its live features.
  server {
    listen 5601 ssl;
    auth_basic           "Warsaw infra";
    auth_basic_user_file /etc/nginx/.htpasswd;
    location / {
      proxy_pass         http://kibana:5601;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_read_timeout 300;
    }
  }

  # Prometheus — basic auth.
  server {
    listen 9090 ssl;
    auth_basic           "Warsaw infra";
    auth_basic_user_file /etc/nginx/.htpasswd;
    location / {
      proxy_pass       http://prometheus:9090;
      proxy_set_header Host $host;
    }
  }

  # Alertmanager — basic auth.
  server {
    listen 9093 ssl;
    auth_basic           "Warsaw infra";
    auth_basic_user_file /etc/nginx/.htpasswd;
    location / {
      proxy_pass       http://alertmanager:9093;
      proxy_set_header Host $host;
    }
  }
}
