# Local Fluent Bit — receives every container's logs via the Docker `fluentd`
# logging driver (forward protocol on :24224) and ships them to Logstash's TCP
# json_lines input on :5000, exactly like the cloud fluent-bit → Logstash leg
# (deploy/cloud/platform/fluent-bit-values.yaml + deploy/cloud/ansible/roles/elk).
[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       Off

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

[OUTPUT]
    Name             tcp
    Match            *
    Host             logstash
    Port             5000
    Format           json_lines
    json_date_key    time
    json_date_format iso8601
