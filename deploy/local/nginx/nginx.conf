# Auth gateway for the local infra UIs. Each server block requires a login
# (basic auth, users in /etc/nginx/.htpasswd — generated by `make infra-auth`)
# and reverse-proxies to the internal service over the docker network. The raw
# service ports are NOT published, so this is the only way in from the host.
# Mirrors the cloud nginx that fronts Kibana with basic auth.
events {}

http {
  # Kibana — needs WebSocket upgrade for its live features.
  server {
    listen 5601;
    auth_basic           "Warsaw infra";
    auth_basic_user_file /etc/nginx/.htpasswd;
    location / {
      proxy_pass         http://kibana:5601;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_read_timeout 300;
    }
  }

  # Prometheus.
  server {
    listen 9090;
    auth_basic           "Warsaw infra";
    auth_basic_user_file /etc/nginx/.htpasswd;
    location / {
      proxy_pass       http://prometheus:9090;
      proxy_set_header Host $host;
    }
  }

  # Alertmanager.
  server {
    listen 9093;
    auth_basic           "Warsaw infra";
    auth_basic_user_file /etc/nginx/.htpasswd;
    location / {
      proxy_pass       http://alertmanager:9093;
      proxy_set_header Host $host;
    }
  }

  # ── The site over HTTPS ───────────────────────────────────────────────────
  # TLS termination in front of the Next.js app (which itself proxies /search,
  # /auth/*, /me etc. to the API). Mirrors the cloud, where ingress-nginx +
  # cert-manager terminate TLS. The cert is self-signed (see deploy/local/certs,
  # `make local-tls`), so the browser shows a one-time "not secure" warning —
  # click through. For a trusted cert without the warning, use mkcert instead.
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    location / {
      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;   # Next HMR / any ws
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;           # tell the app it's HTTPS
      proxy_read_timeout 300;
    }
  }

  # Plain HTTP → redirect to HTTPS.
  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }
}
