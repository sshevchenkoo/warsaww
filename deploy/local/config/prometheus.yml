# Local Prometheus config — the Compose equivalent of the cloud's
# additionalScrapeConfigs (kube-prometheus-stack-values.yaml). Same jobs
# (warsaw-api, otel-collector, postgres), plus Prometheus itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The FastAPI app's /metrics (prometheus-fastapi-instrumentator).
  - job_name: warsaw-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # OTLP metrics the collector re-exposes on :8889.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # PostgreSQL metrics (pg_up, connections, …).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Host VM resources (CPU/RAM/disk/network/load) — node-exporter.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container resources (CPU/RAM/network per container) — cAdvisor.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
