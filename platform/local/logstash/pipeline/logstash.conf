# Local Logstash pipeline — mirrors infrastructure/ansible/roles/elk/templates/
# logstash.conf.j2: a TCP json_lines input from Fluent Bit, indexed into
# Elasticsearch. Kibana reads the resulting index.
input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # Use the log's own timestamp as @timestamp when present.
  if [time] {
    date {
      match        => ["time", "ISO8601"]
      target       => "@timestamp"
      remove_field => ["time"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "warsaw-logs-%{+YYYY.MM.dd}"
  }
}
